<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c6cfb8"/>
      <stop offset="50%" stop-color="#d9d4c4"/>
      <stop offset="100%" stop-color="#7c8f78"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffefb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fffefb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#spot)"/>
  <g fill="#3a4238" font-family="Georgia, serif" text-anchor="middle">
    <text x="200" y="240" font-size="28" font-style="italic" opacity="0.85">Your photo</text>
    <text x="200" y="274" font-size="14" opacity="0.6" letter-spacing="4">GOES HERE</text>
  </g>
  <g stroke="#3a4238" stroke-opacity="0.25" fill="none">
    <circle cx="200" cy="250" r="118"/>
    <circle cx="200" cy="250" r="130"/>
  </g>
</svg>
